# Hygiène du plugin : tests unitaires + build complet (typecheck, bundles,
# manifest) sur chaque PR et chaque push sur main.
name: ci
on:
  push:
    branches: [main]
  pull_request:

# Le job ne fait que lire le dépôt. On fige ce minimum au lieu d'hériter du
# réglage par défaut de l'organisation, qui peut accorder l'écriture : du code
# tiers s'exécute ici, du transpileur au bundler, inutile de lui confier un
# jeton capable d'écrire. À étendre (`pull-requests: write`) le jour où ce
# workflow commentera une PR, comme le fait celui du playground.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # L'historique COMPLET, et ce n'est pas du confort. `actions/checkout`
      # ne prend qu'un commit par défaut ; `versionSuitLeContenu.test.mjs`
      # remonte jusqu'au commit qui a posé le numéro de version de chaque
      # paquet, et sur un clone superficiel il ne trouverait rien à comparer.
      # Un garde-fou qui ne peut pas mesurer est pire qu'absent : il se lit
      # vert.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # La version de npm est épinglée, exactement comme dans `publish.yml`, et
      # pour une raison qui n'est pas le confort : npm 12 refuse par défaut les
      # scripts d'installation des dépendances, npm 11 les exécute. Sans cet
      # épinglage, ce workflow installerait autrement que celui qui publie, et
      # il changerait de sémantique le jour où l'image du runner change de npm,
      # sans qu'une ligne d'ici ait bougé. Le poste, la CI et la publication
      # doivent répondre pareil sur le même arbre de dépendances.
      #
      # Le `postinstall` d'esbuild reste bloqué, et rien ne l'approuve. esbuild
      # résout son binaire par ses `optionalDependencies`, un paquet par
      # plateforme, et `install.js` n'est qu'un repli : la publication tourne
      # déjà sous npm 12 avec ce script bloqué, et `tsx` y transpile les tests
      # avec ce même esbuild. L'approuver rétablirait un chemin dont ce dépôt
      # n'a pas besoin, et un `allowScripts` commité se lit comme une
      # permission durable.
      - run: npm install -g npm@12.0.2 && npm -v

      # `npm ci` construit le kit au passage : son script `prepare` le fait,
      # et npm l'exécute pour chaque workspace à l'installation. Sans cela,
      # `npm test` tournerait avant que `dist/` existe et les tests du plugin
      # échoueraient sur `Cannot find module '@ucm-kit/core/format'` — ce qui
      # est arrivé, invisible en local où `dist/` traîne d'un build précédent.
      - run: npm ci
      - run: npm test
      - run: npm run build
