# Publication des paquets `@ucm-kit/*` sur npm, SANS jeton.
#
# Pourquoi ce workflow existe. npm restreint désormais les jetons capables de
# publier sans intervention humaine — c'est ce que dit son propre avertissement,
# « npm tokens that bypass 2FA are being restricted for account changes and
# direct publishing ». Un jeton posé sur un poste ne peut donc plus publier, et
# ce n'est pas un réglage à trouver : c'est la réponse de npm aux attaques sur
# la chaîne d'approvisionnement.
#
# Le remplaçant est le « trusted publishing » : GitHub prouve à npm l'identité
# de CE dépôt et de CE workflow par OIDC, et npm accepte la publication sans
# qu'aucun secret n'existe nulle part — ni dans les secrets du dépôt, ni dans un
# `.npmrc`, ni sur la machine du mainteneur. Rien à faire tourner, rien à
# révoquer, rien à fuiter.
#
# Effet de bord précieux pour ce projet : la publication devient reproductible.
# Le paquet cesse de dépendre de l'état du poste de qui publie — c'est la même
# exigence que D5 pose au kit, appliquée à la façon dont il sort.
name: publish

# Déclenchement manuel, et volontairement pas sur un push. Publier est
# irréversible : une version part pour toujours, et npm n'en rend le numéro à
# personne. Le geste doit rester un geste.
#
# Le paquet se CHOISIT, et ce n'est pas du confort. Publier les deux à chaque
# fois ferait échouer le run sur un 409 « cette version existe déjà » dès que
# l'un des deux n'a pas bougé — et un run rouge dont la cause normale est « il
# n'y avait rien à publier » est un run qu'on apprend à ignorer. `@ucm-kit/cli`
# épingle exactement `@ucm-kit/core` : quand les deux montent ensemble, publier
# le noyau d'abord, sinon `npx @ucm-kit/cli` installerait une dépendance absente
# du registre.
on:
  workflow_dispatch:
    inputs:
      paquet:
        description: "Le paquet à publier"
        required: true
        type: choice
        default: "@ucm-kit/core"
        options:
          - "@ucm-kit/core"
          - "@ucm-kit/cli"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # `id-token: write` est ce qui autorise GitHub à fabriquer le jeton OIDC
      # que npm vérifie. Sans lui, la publication échoue en réclamant un jeton
      # classique — l'impasse que ce workflow existe pour sortir.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # `registry-url` est nécessaire, et l'essai inverse l'a prouvé : sans lui,
      # `npm publish` rend `ENEEDAUTH` et ne tente pas l'OIDC du tout. Il écrit
      # pourtant une ligne `_authToken=${NODE_AUTH_TOKEN}` vide dans le `.npmrc`
      # du runner — inoffensive, npm interroge le registre avant de s'en servir.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      # Le trusted publishing n'existe qu'à partir de npm 11.5.1, et l'image
      # GitHub embarque une version plus ancienne. Sans cette montée, `npm
      # publish` réclame un jeton sans même tenter l'OIDC. La version est
      # affichée parce qu'un échec d'OIDC est muet : si elle repassait sous le
      # seuil, rien d'autre ne le dirait.
      - run: npm install -g npm@latest && npm -v

      # `npm ci` construit le kit au passage — son script `prepare` s'en charge
      # pour chaque workspace. On ne publie donc jamais un `dist/` traînant.
      # L'identité que GitHub présente à npm. Elle est affichée parce qu'un
      # refus OIDC ne dit jamais QUEL champ ne correspond pas : il rend « OIDC
      # permission denied » et rien d'autre. Ces valeurs sont exactement ce
      # qu'attend le formulaire d'éditeur de confiance, et aucune n'est un
      # secret — le jeton, lui, ne sort pas d'ici.
      - name: Identité OIDC présentée à npm
        run: |
          echo "Organization or user : ${GITHUB_REPOSITORY%%/*}"
          echo "Repository           : ${GITHUB_REPOSITORY##*/}"
          echo "Workflow filename    : ${GITHUB_WORKFLOW_REF##*/workflows/}"
          echo "Environment          : (aucun)"
          echo "workflow_ref complet : $GITHUB_WORKFLOW_REF"

      # LE point qui manquait, et il est documenté (actions/setup-node#1551).
      # `registry-url` écrit dans le .npmrc du runner une ligne
      # `_authToken=${NODE_AUTH_TOKEN}` même sans jeton. npm y voit une
      # authentification déjà configurée et NE DÉCLENCHE JAMAIS l'échange de
      # jeton OIDC : il publie avec une identité vide, et le registre refuse.
      #
      # C'est ce qui rendait le symptôme incompréhensible : la signature de
      # provenance, elle, lit directement les variables ACTIONS_ID_TOKEN_REQUEST_*
      # et réussissait. Le même jeton signait donc l'attestation et se voyait
      # refuser la publication — parce que la publication ne l'utilisait pas.
      #
      # Retirer `registry-url` ne marche pas non plus : sans registre configuré,
      # npm rend `ENEEDAUTH`. Il faut les deux — le registre, et pas de ligne
      # d'authentification.
      - name: Retirer la ligne d'authentification vide
        run: |
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          sed -i '/_authToken/d' "$npmrc"
          echo "--- .npmrc effectif ---"
          cat "$npmrc"

      - run: npm ci
      - run: npm test

      # Aucun `NODE_AUTH_TOKEN` : npm détecte l'environnement OIDC et s'y
      # authentifie seul. Il en tire aussi une attestation de provenance, qui
      # dit publiquement de quel commit et de quel workflow ce tarball sort.
      #
      # ✔ Tranché le 4 septembre 2026 : c'était (a), l'entrée d'éditeur de
      # confiance. Elle a été supprimée et recréée sur npm, et l'exécution
      # suivante est passée de « OIDC permission denied » (403) à « Cannot
      # publish over previously staged version » (409) — sans qu'une ligne de
      # ce fichier ait changé entre les deux. Le registre accepte donc
      # l'identité que GitHub lui présente, et ne refusait plus que le numéro
      # de version, 0.1.1 existant déjà. La publication sans jeton fonctionne.
      #
      # Ce qu'il fallait pour y arriver, dans l'ordre, chaque pas prouvé par une
      # exécution réelle :
      #   1. `registry-url`, sans quoi npm rend ENEEDAUTH et ne tente pas
      #      l'OIDC ;
      #   2. le retrait de la ligne `_authToken` vide que `registry-url` écrit,
      #      qui empêchait l'échange de jeton (actions/setup-node#1551) ;
      #   3. la recréation de l'entrée d'éditeur de confiance côté npm — npm NE
      #      VALIDE PAS cette configuration à l'enregistrement, sa documentation
      #      le dit, donc une faute de frappe y reste invisible. L'étape
      #      « Identité OIDC » ci-dessus affiche ce qu'il faut y retrouver,
      #      champ par champ ; le nom du workflow s'y écrit sans chemin,
      #      `publish.yml`.
      #
      # Cinq pistes ont été testées et ÉCARTÉES en chemin. Ne pas les refaire :
      # la provenance (désactivée par NPM_CONFIG_PROVENANCE, même refus) ; le
      # dépôt privé (passé en public, même refus — la provenance, elle, exige
      # bien du code public) ; le « Publishing access » du paquet ;
      # `--workspace` contre une publication depuis le dossier du paquet ; la
      # version de npm, 12.0.2 en CI, très au-dessus du seuil 11.5.1. Le bug npm
      # ouvert sur les paquets scopés (npm/cli#8976, #8730, #8678) décrivait nos
      # symptômes, mais ce n'était pas lui.
      #
      # Conséquence pratique : une version ne se publie qu'UNE fois. Relancer
      # ce workflow sans avoir monté le `package.json` du paquet choisi rend 409, et
      # c'est le comportement voulu — pas une régression de l'authentification.
      #
      # `@ucm-kit/cli` doit publier aussi : sans lui, `npx @ucm-kit/cli` rend
      # 404 et le workflow que `ucm init` écrit installe une CI qui ne peut pas
      # démarrer. C'est une précondition de T3.4, pas un extra.
      #
      # ⚠ **La PREMIÈRE version d'un paquet ne part pas d'ici**, et ce n'est pas
      # un réglage à trouver : l'entrée d'éditeur de confiance se déclare POUR
      # UN PAQUET, et un paquet qui n'existe pas sur le registre n'en a pas.
      # Mesuré le 5 septembre 2026 sur `@ucm-kit/cli@0.1.1` : le tarball se
      # construit, puis `npm publish` rend ENEEDAUTH — npm ne tente aucun
      # échange OIDC parce qu'il n'a personne à qui l'opposer. C'est exactement
      # ce qui s'était passé pour `@ucm-kit/core`, dont les 0.1.0 et 0.1.1 sont
      # parties à la main avec un code 2FA avant que l'OIDC ne prenne le relais.
      # La marche à suivre, une fois par NOM de paquet :
      #   1. `npm publish --workspace <paquet>` depuis un poste, avec 2FA ;
      #   2. déclarer l'éditeur de confiance sur npm — Organization `Vassili-g`,
      #      Repository `UCM-Exporter`, Workflow `publish.yml`, aucun
      #      environnement (l'étape « Identité OIDC » ci-dessus affiche ces
      #      valeurs, champ par champ, telles que le runner les présente) ;
      #   3. toutes les versions suivantes partent d'ici.
      - name: Publier ${{ inputs.paquet }}
        env:
          PAQUET: ${{ inputs.paquet }}
        run: npm publish --workspace "$PAQUET"

      # L'ÉPREUVE DU REGISTRE, et elle existe parce que son absence a coûté une
      # version publiée cassée.
      #
      # Ce qui s'est passé le 5 septembre 2026. T4.1 a ajouté
      # `configurationDepuisJson` à la surface publiée du kit SANS monter son
      # numéro : le dépôt portait 0.1.6 et le registre portait un autre 0.1.6.
      # `@ucm-kit/cli@0.1.1` est ensuite parti en épinglant `0.1.6`, donc en
      # allant chercher l'ancien sur le registre, et `npx @ucm-kit/cli` mourait
      # à l'import sur un export manquant. **Un numéro de version publié est
      # immuable : changer ce que le kit publie exige de monter son numéro dans
      # le MÊME commit.**
      #
      # Aucun contrôle du dépôt ne pouvait le voir, et c'est le point. `npm ci`
      # lie le workspace : tout se construit, se type et se teste contre la
      # source d'à côté, qui est juste. Le seul endroit où le mensonge existe
      # est le registre, et le seul moyen de l'y voir est d'y aller.
      #
      # L'épreuve est donc faite d'un consommateur réel : un dossier vide, sans
      # `package.json`, sans `node_modules`, et la commande qu'un repo tiers
      # lance vraiment. Elle est POSTÉRIEURE à la publication — une version part
      # pour toujours et rien ne la rattrape —, et c'est déjà tout ce qu'il
      # faut : elle transforme un mensonge qui aurait vécu des jours en un run
      # rouge dans la minute, quand le correctif ne coûte qu'un numéro de plus.
      - name: Épreuve du registre
        env:
          PAQUET: ${{ inputs.paquet }}
        run: |
          version=$(node -p "require('./packages/${PAQUET#@ucm-kit/}/package.json').version" 2>/dev/null \
            || node -p "require('./packages/kit/package.json').version")
          echo "Épreuve de $PAQUET@$version depuis un dossier vierge."
          neuf=$(mktemp -d)
          cd "$neuf"

          # Le registre ne sert pas toujours la nouvelle version dans la
          # seconde. Une boucle courte distingue « pas encore propagée » de
          # « cassée », que sans elle on confondrait.
          for essai in 1 2 3 4 5; do
            if npm view "$PAQUET@$version" version >/dev/null 2>&1; then break; fi
            echo "  pas encore visible sur le registre (essai $essai)…"
            sleep 10
          done

          if [ "$PAQUET" = "@ucm-kit/cli" ]; then
            # Exactement ce qu'écrit `ucm init` dans le workflow d'un repo tiers.
            npx --yes "@ucm-kit/cli@$version" --help
          else
            # Les deux sous-chemins publiés, importés comme un consommateur le
            # fait. Un `exports` fautif ou un import relatif sans extension `.js`
            # échoue ici et nulle part ailleurs.
            npm install --no-audit --no-fund "$PAQUET@$version"
            node --input-type=module -e "
              await import('@ucm-kit/core/format');
              await import('@ucm-kit/core/lecteurs');
              console.log('Les deux sous-chemins du kit se chargent.');
            "
          fi
