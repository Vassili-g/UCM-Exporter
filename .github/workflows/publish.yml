# Publication de `@ucm-kit/core` sur npm, SANS jeton.
#
# Pourquoi ce workflow existe. npm restreint désormais les jetons capables de
# publier sans intervention humaine — c'est ce que dit son propre avertissement,
# « npm tokens that bypass 2FA are being restricted for account changes and
# direct publishing ». Un jeton posé sur un poste ne peut donc plus publier, et
# ce n'est pas un réglage à trouver : c'est la réponse de npm aux attaques sur
# la chaîne d'approvisionnement.
#
# Le remplaçant est le « trusted publishing » : GitHub prouve à npm l'identité
# de CE dépôt et de CE workflow par OIDC, et npm accepte la publication sans
# qu'aucun secret n'existe nulle part — ni dans les secrets du dépôt, ni dans un
# `.npmrc`, ni sur la machine du mainteneur. Rien à faire tourner, rien à
# révoquer, rien à fuiter.
#
# Effet de bord précieux pour ce projet : la publication devient reproductible.
# Le paquet cesse de dépendre de l'état du poste de qui publie — c'est la même
# exigence que D5 pose au kit, appliquée à la façon dont il sort.
name: publish

# Déclenchement manuel, et volontairement pas sur un push. Publier est
# irréversible : une version part pour toujours, et npm n'en rend le numéro à
# personne. Le geste doit rester un geste.
on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # `id-token: write` est ce qui autorise GitHub à fabriquer le jeton OIDC
      # que npm vérifie. Sans lui, la publication échoue en réclamant un jeton
      # classique — l'impasse que ce workflow existe pour sortir.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # `registry-url` est nécessaire, et l'essai inverse l'a prouvé : sans lui,
      # `npm publish` rend `ENEEDAUTH` et ne tente pas l'OIDC du tout. Il écrit
      # pourtant une ligne `_authToken=${NODE_AUTH_TOKEN}` vide dans le `.npmrc`
      # du runner — inoffensive, npm interroge le registre avant de s'en servir.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      # Le trusted publishing n'existe qu'à partir de npm 11.5.1, et l'image
      # GitHub embarque une version plus ancienne. Sans cette montée, `npm
      # publish` réclame un jeton sans même tenter l'OIDC. La version est
      # affichée parce qu'un échec d'OIDC est muet : si elle repassait sous le
      # seuil, rien d'autre ne le dirait.
      - run: npm install -g npm@latest && npm -v

      # `npm ci` construit le kit au passage — son script `prepare` s'en charge
      # pour chaque workspace. On ne publie donc jamais un `dist/` traînant.
      # L'identité que GitHub présente à npm. Elle est affichée parce qu'un
      # refus OIDC ne dit jamais QUEL champ ne correspond pas : il rend « OIDC
      # permission denied » et rien d'autre. Ces valeurs sont exactement ce
      # qu'attend le formulaire d'éditeur de confiance, et aucune n'est un
      # secret — le jeton, lui, ne sort pas d'ici.
      - name: Identité OIDC présentée à npm
        run: |
          echo "Organization or user : ${GITHUB_REPOSITORY%%/*}"
          echo "Repository           : ${GITHUB_REPOSITORY##*/}"
          echo "Workflow filename    : ${GITHUB_WORKFLOW_REF##*/workflows/}"
          echo "Environment          : (aucun)"
          echo "workflow_ref complet : $GITHUB_WORKFLOW_REF"

      - run: npm ci
      - run: npm test

      # Aucun `NODE_AUTH_TOKEN` : npm détecte l'environnement OIDC et s'y
      # authentifie seul. Il en tire aussi une attestation de provenance, qui
      # dit publiquement de quel commit et de quel workflow ce tarball sort.
      #
      # ⚠ État au 4 septembre 2026 : ce dernier pas rend « OIDC permission
      # denied ». npm reconnaît donc l'OIDC et REFUSE l'identité — ce n'est plus
      # un problème d'authentification mais d'autorisation, et le refus ne dit
      # jamais quel champ ne correspond pas. Deux causes restent en lice, et la
      # provenance a été écartée par l'essai (`NPM_CONFIG_PROVENANCE: false`
      # donne le même refus) :
      #   1. un champ de l'éditeur de confiance qui diffère de ce que l'étape
      #      « Identité OIDC » affiche juste au-dessus ;
      #   2. le dépôt est PRIVÉ, et npm pourrait ne pas accepter le trusted
      #      publishing depuis un dépôt privé.
      # Tant que ce n'est pas tranché, la publication se fait à la main avec un
      # code 2FA. Ce workflow reste ici : il est correct jusqu'à ce pas, et
      # `npm ci` + `npm test` y valident déjà la publication à venir.
      - name: Publier depuis le dossier du paquet
        working-directory: packages/kit
        run: npm publish
